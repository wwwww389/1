<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点开有惊喜</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #content { text-align: center; z-index: 10; }
        h1 { font-size: 50px; color: white; text-shadow: 0 0 20px rgba(255, 255, 255, 0.8); }
        p { font-size: 25px; color: #fff; margin-bottom: 50px; }
        .btn {
            font-size: 25px;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 0 20px;
            font-weight: bold;
        }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #fff; color: #ff4d6d; position: absolute; }
        
        #successContent {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            color: white;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        #successContent h1 { font-size: 60px; }

        /* 使用 fixed 定位的爱心雨 */
        .heart {
            position: fixed;
            top: -10vh;
            color: #ff4d6d;
            font-size: 20px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 5;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
        #fireworks { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="fireworks"></canvas>
    
    <div id="content">
        <h1>我喜欢你 💖</h1>
        <p>可以做我的女朋友吗？</p>
        <button class="btn" id="yesBtn" onclick="showYes()">我愿意！</button>
        <button class="btn" id="noBtn">不愿意...</button>
    </div>

    <div id="successContent">
        <h1>我就知道你会同意的！❤️</h1>
        <p>我会一直陪着你，永远爱你！</p>
    </div>

    <script>
        // 拒绝按钮跑掉
        var noBtn = document.getElementById('noBtn');
        noBtn.addEventListener('mouseover', function() {
            noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            noBtn.style.top = Math.random() * (window.innerHeight - 100) + 'px';
        });
        noBtn.addEventListener('click', function() {
            noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            noBtn.style.top = Math.random() * (window.innerHeight - 100) + 'px';
        });

        // 点击愿意后的触发
        function showYes() {
            document.getElementById('content').style.display = 'none';
            document.getElementById('successContent').style.display = 'block';

            startHeartRain(); // 开启爱心雨
            animate();        // 开启烟花
        }

        // 爱心雨逻辑
        function startHeartRain() {
            setInterval(function() {
                var heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                heart.style.fontSize = (Math.random() * 30 + 15) + 'px';
                document.body.appendChild(heart);
                setTimeout(function() { heart.remove(); }, 5000);
            }, 200);
        }

        // 烟花逻辑
        var canvas = document.getElementById('fireworks');
        var ctx = canvas.getContext('2d');
        var W = window.innerWidth;
        var H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
        var particles = [];

        function boom(x, y) {
            for (var i = 0; i < 80; i++) {
                var angle = Math.PI * 2 / 80 * i;
                var speed = Math.random() * 5 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    color: `hsl(${340 + Math.random() * 30}, 100%, 60%)`
                });
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, W, H);
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.life -= 0.015;
                if (p.life <= 0) { particles.splice(i, 1); i--; continue; }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
