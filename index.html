<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一封给你的信</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: 'Microsoft YaHei', sans-serif;
            color: white;
        }

        /* 屏幕中间的容器 */
        #container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 600px;
        }

        /* 打字机效果文字 */
        #typewriter {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 2;
            min-height: 200px;
            border-right: 2px solid rgba(255,255,255,0.75);
            white-space: pre-wrap;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 50px;
        }

        /* 按钮样式 */
        .btn {
            font-size: 1.4rem;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.5);
            transition: all 0.3s;
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758c);
            color: white;
        }

        #noBtn {
            background: rgba(255,255,255,0.1);
            color: #ff4d6d;
            border: 1px solid #ff4d6d;
            position: absolute;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* 隐藏未解封的元素 */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="starCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <div id="container">
        <h2 style="color: #ff4d6d;">🔒 这是一封加密的信</h2>
        <p>请输入你的名字（或小名）解锁：</p>
        <input type="text" id="password" placeholder="输入你的名字..." style="padding: 10px; width: 200px; border-radius: 10px; border: none; outline: none; text-align: center;">
        <br><br>
        <button class="btn" onclick="checkPassword()" style="background: #fff; color: #ff4d6d;">解锁</button>

        <!-- 解锁后显示的内容 -->
        <div id="content" class="hidden">
            <div id="typewriter"></div>
            <div id="buttons" class="hidden">
                <button class="btn" id="yesBtn" onclick="showLove()">我愿意 ❤️</button>
                <button class="btn" id="noBtn">我考虑考虑</button>
            </div>
        </div>
    </div>

    <script>
        // === 1. 背景星空特效 ===
        const starCanvas = document.getElementById('starCanvas');
        const starCtx = starCanvas.getContext('2d');
        let w = window.innerWidth, h = window.innerHeight;
        starCanvas.width = w; starCanvas.height = h;
        
        let stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.5, o: Math.random() });
        }
        
        function drawStars() {
            starCtx.clearRect(0, 0, w, h);
            stars.forEach(s => {
                starCtx.beginPath();
                starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                starCtx.fillStyle = `rgba(255, 255, 255, ${s.o})`;
                starCtx.fill();
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // === 2. 打字机情书逻辑 ===
        const loveText = "遇见你之后，\n我的世界好像变成了粉红色。\n我想了很久，\n决定把今天变成一个特殊的纪念日。\n你愿意，做我的女朋友吗？";
        let index = 0;
        
        function typeWriter() {
            if (index < loveText.length) {
                document.getElementById('typewriter').innerHTML = loveText.substring(0, index++) + '|';
                setTimeout(typeWriter, 80); // 打字速度
            } else {
                document.getElementById('typewriter').innerHTML = loveText;
                document.getElementById('buttons').classList.remove('hidden');
            }
        }

        // === 3. 密码解锁逻辑 ===
        function checkPassword() {
            const pass = document.getElementById('password').value;
            if (pass.trim() === "") {
                alert("请输入名字哦~");
                return;
            }
            // 隐藏加密界面，展示情书
            document.querySelector('h2').classList.add('hidden');
            document.querySelector('p').classList.add('hidden');
            document.getElementById('password').classList.add('hidden');
            document.querySelector('button').classList.add('hidden');
            
            document.getElementById('content').classList.remove('hidden');
            typeWriter();
        }

        // === 4. 拒绝按钮逃跑逻辑 ===
        let noBtn = document.getElementById('noBtn');
        noBtn.addEventListener('mouseover', function() {
            this.style.left = Math.random() * (window.innerWidth - 150) + 'px';
            this.style.top = Math.random() * (window.innerHeight - 50) + 'px';
        });
        
        // 手机端强制点不到
        noBtn.addEventListener('click', function() {
            this.style.left = Math.random() * (window.innerWidth - 150) + 'px';
            this.style.top = Math.random() * (window.innerHeight - 50) + 'px';
        });

        // === 5. 高级心形粒子烟花（点击屏幕触发） ===
        const fwCanvas = document.getElementById('fireworksCanvas');
        const ctx = fwCanvas.getContext('2d');
        fwCanvas.width = w; fwCanvas.height = h;
        let particles = [];

        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x, y: y };
        }

        function boomHeart(x, y) {
            for (let i = 0; i < 120; i++) {
                const angle = Math.PI * 2 / 120 * i;
                const point = getHeartPoint(angle);
                particles.push({
                    x: x, y: y,
                    vx: point.x * 0.25,
                    vy: point.y * 0.25,
                    life: 1,
                    color: `hsl(${330 + Math.random() * 30}, 100%, 70%)`,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function animateFireworks() {
            ctx.fillStyle = 'rgba(9, 10, 15, 0.2)';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.life -= 0.015;
                if (p.life <= 0) { particles.splice(i, 1); i--; continue; }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        // 点击屏幕触发心形烟花
        window.addEventListener('click', function(e) {
            boomHeart(e.clientX, e.clientY);
        });

        // === 6. 点“我愿意”后的终极爆发 ===
        function showLove() {
            document.getElementById('content').classList.add('hidden');
            boomHeart(w / 2, h / 2);
            setTimeout(() => boomHeart(w / 3, h / 3), 300);
            setTimeout(() => boomHeart(2 * w / 3, h / 3), 600);
            
            const msg = document.createElement('div');
            msg.style.position = 'fixed';
            msg.style.top = '50%';
            msg.style.left = '50%';
            msg.style.transform = 'translate(-50%, -50%)';
            msg.style.fontSize = '3rem';
            msg.style.zIndex = '100';
            msg.innerHTML = '❤️ 我就知道！ ❤️';
            document.body.appendChild(msg);
        }
    </script>
</body>
</html>
